<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangout — chamada com a galera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div id="join-screen" class="join-screen">
    <div class="join-card">
      <div class="join-mark">
        <span class="join-mark-dot"></span>
        Hangout
      </div>
      <h1>Chama a galera pra sala</h1>
      <p class="join-sub">Câmera, tela e voz numa call só. Cria uma sala e manda o código pros seus amigos.</p>

      <label class="field">
        <span>Seu nome</span>
        <input id="input-name" type="text" maxlength="24" placeholder="Ex: Léo" autocomplete="off" />
      </label>

      <label class="field">
        <span>Código da sala</span>
        <input id="input-room" type="text" maxlength="24" placeholder="Ex: turma-do-fim-de-semana" autocomplete="off" />
      </label>

      <button id="btn-join" class="btn-primary">Entrar na sala</button>
      <p class="join-hint">Se o código não existir ainda, ele é criado na hora.</p>
      <p id="join-error" class="join-error"></p>
    </div>
  </div>

  <!-- TELA DA CHAMADA -->
  <div id="call-screen" class="call-screen hidden">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="room-badge">
          <span class="live-dot"></span>
          <div>
            <div class="room-name" id="room-name-label">sala</div>
            <div class="room-status" id="room-status">conectando…</div>
          </div>
        </div>
      </div>

      <div class="participants">
        <div class="participants-title">Na sala</div>
        <ul id="participant-list" class="participant-list"></ul>
      </div>

      <button id="btn-copy-link" class="btn-ghost">Copiar link do convite</button>
    </aside>

    <main class="stage">
      <div id="screen-stage" class="screen-stage hidden"></div>
      <div id="video-grid" class="video-grid"></div>

      <div class="controls">
        <button id="btn-mic" class="ctrl-btn" title="Microfone" data-on="true">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0" fill="none" stroke-width="2"/><path d="M12 19v3" stroke-width="2"/></svg>
        </button>
        <button id="btn-cam" class="ctrl-btn" title="Câmera" data-on="true">
          <svg viewBox="0 0 24 24" class="icon"><path d="M3 7a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M21 8.5 16 11l5 2.5v-5Z"/></svg>
        </button>
        <button id="btn-screen" class="ctrl-btn" title="Compartilhar tela" data-on="false">
          <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4" stroke-width="2"/></svg>
        </button>
        <button id="btn-chat" class="ctrl-btn" title="Chat" data-on="false">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>
        </button>
        <button id="btn-leave" class="ctrl-btn ctrl-leave" title="Sair da sala">
          <svg viewBox="0 0 24 24" class="icon"><path d="m6 6 12 12M18 6 6 18" stroke-width="2.4"/></svg>
        </button>
      </div>
    </main>

    <aside id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">Chat da sala</div>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="1000" placeholder="Escreve aí…" autocomplete="off" />
        <button type="submit" class="chat-send">Enviar</button>
      </form>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
